<!--
    ============ COPIE DAQUI ATÉ O FIM DA </section> ============
    Opções (todas opcionais) no atributo data- da <section>:
      data-autoplay="false"   desliga a rotação automática
      data-interval="2600"    tempo entre os slides (ms)
      data-spacing="1.16"     distância entre cards (1 = encostados)
      data-tilt="9"           inclinação por posição (graus)
      data-depth="14"         quanto as bordas "avançam" para o espectador (px)
      data-visible="3"        quantos cards aparecem de cada lado do centro
  -->
